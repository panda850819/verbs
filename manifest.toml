# Verbs manifest — single source of truth for product identity, runtime skills,
# dependencies, and vendored resources.

[product]
id = "verbs"
display_name = "Verbs"
marketplace_id = "verbs"
repository = "panda850819/verbs"
homepage = "https://github.com/panda850819/verbs"
description = "Project contracts and specialist procedures for coding agents."
hero = "Bind how a project defines, verifies, and delivers work to AGENTS.md."
support = "Skills-only Marketplace Plugins support Claude Code and Codex. Pi supports direct skill loading."
category = "Developer Tools"
environment_prefix = "VERBS"
keywords = ["agent-skills", "coding-agents", "software-engineering", "review", "ship", "debug"]

[manifest]
version = "0.33.1"
schema  = "skill-tier-v1"
updated = "2026-09-08"

# Project intake, Brain First retrieval, automatic Grilling Sessions, and
# delivery policy live in the root AGENTS.md Project Contract. Runtime skills
# exist only where a specialist procedure has a material execution delta.

[skill.careful]
tier = "core"
resources = ["lib/verify-the-test-loop.md"]
composes = []
description = "Confirmation gate before destructive commands or high-risk changes to production, shared infrastructure, or live harness configuration."

[skill.gatekeeper]
tier = "core"
resources = []
composes = []
description = "Review external skills, MCPs, repositories, packages, URLs, APIs, or services before execution, adoption, or granting access; recommend adopt, restrict, or reject."

[skill.review]
tier = "core"
requires = ["cli:git"]
resources = ["lib/learning-recall.md"]
composes = []
description = "Risk-adaptive diff review on request, before commit, or before PR, with a bounded low-risk fast path and cold-context escalation."

[skill.debug]
tier = "core"
requires = ["cli:git"]
resources = ["lib/learning-format.md", "lib/learning-recall.md", "lib/verify-the-test-loop.md"]
composes = []
description = "Diagnose an unexplained error, crash, regression, or failing test; reproduce the mechanism and verify the fix on the failing path."

[skill.ui]
tier = "core"
resources = []
composes = []
description = "Build or visually correct production UI with a deliberate direction and rendered evidence; use prototype while the design decision remains open."

[skill.qa]
tier = "core"
resources = ["lib/learning-format.md", "lib/qa-evidence-format.md"]
composes = []
description = "Verify browser-visible acceptance on the current artifact using host browser automation; preserve evidence for PR delivery."

[skill.prototype]
tier = "core"
resources = []
composes = []
description = "Build a disposable logic or UI probe to answer one unresolved design question; capture the decision without silently expanding into production work."

[skill.ship]
tier = "ext"
requires = ["cli:git", "cli:gh"]
resources = ["lib/learning-format.md", "lib/qa-evidence-format.md", "lib/trigger-first-skill-evolution.md", "lib/verify-the-test-loop.md"]
composes = []
description = "On authorization to ship completed code, verify tests and review, commit scoped changes on a non-default branch, and publish the PR with current QA evidence."
